services:
  postgres:
    container_name: seer-thread-2-postgres
    image: postgres:16-alpine
    ports:
      - "10200:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-seer}
    volumes:
      - seer-thread-2-postgres_data:/var/lib/postgresql/data
      - /Users/pika/Projects/seer/.worktrees/thread-2/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seer}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seer-thread-2-network

  valkey:
    container_name: seer-thread-2-valkey
    image: valkey/valkey:7-alpine
    ports:
      - "10201:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seer-thread-2-network

  api:
    container_name: seer-thread-2-api
    build:
      context: /Users/pika/Projects/seer/.worktrees/thread-2
      dockerfile: Dockerfile
    ports:
      - "10202:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - /Users/pika/Projects/seer/.worktrees/thread-2/.env.docker
    environment:
      UV_LINK_MODE: "copy"
      AUTO_APPLY_DATABASE_MIGRATIONS: "true"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - /Users/pika/Projects/seer/.worktrees/thread-2:/app
      - /app/.venv
    command: >
      sh -c "
        echo 'Starting API server...' &&
        sleep 2 &&
        uv run uvicorn seer.api.main:app --host 0.0.0.0 --port 8000 --reload --log-level info
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - seer-thread-2-network

  worker:
    container_name: seer-thread-2-worker
    build:
      context: /Users/pika/Projects/seer/.worktrees/thread-2
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - /Users/pika/Projects/seer/.worktrees/thread-2/.env.docker
    environment:
      UV_LINK_MODE: "copy"
    volumes:
      - /Users/pika/Projects/seer/.worktrees/thread-2:/app
      - /app/.venv
    command: >
      sh -c "
        echo 'Starting worker...' &&
        sleep 2 &&
        uv run taskiq worker seer.worker.broker:broker
      "
    networks:
      - seer-thread-2-network

volumes:
  seer-thread-2-postgres_data:

networks:
  seer-thread-2-network:
    driver: bridge
