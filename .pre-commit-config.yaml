# Pre-commit hooks for code quality enforcement
# Install: pip install pre-commit && pre-commit install

repos:
  # Flake8 - Style and complexity checks
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --max-complexity=10
          - --exclude=alembic/versions,.venv,venv,build,dist

  # Radon - Code complexity metrics
  - repo: local
    hooks:
      - id: radon-complexity
        name: radon complexity check
        entry: radon cc
        language: system
        args:
          - --min=B  # Fail on complexity grade B or worse (complexity > 10)
          - --exclude=alembic/versions,.venv,venv,build,dist
        files: \.py$
        pass_filenames: true

      - id: radon-maintainability
        name: radon maintainability check
        entry: radon mi
        language: system
        args:
          - --min=B  # Fail on maintainability grade B or worse
          - --exclude=alembic/versions,.venv,venv,build,dist
        files: \.py$
        pass_filenames: true

  # Pylint - Comprehensive linting with configured limits
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args:
          - --max-line-length=100
          - --max-module-lines=600
          - --max-complexity=10
          - --ignore=alembic/versions,.venv,venv,build,dist
        files: \.py$

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
