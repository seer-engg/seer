services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-seer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.8.1
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: "sqlite:////mlflow/mlflow.db"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "/mlflow/artifacts"
      MLFLOW_ALLOWED_HOSTS: "*"
    volumes:
      - mlflow_data:/mlflow
    command: >
      sh -c "mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow/mlflow.db}
      --default-artifact-root ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlflow/artifacts}
      --allowed-hosts \"${MLFLOW_ALLOWED_HOSTS:-*}\""

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      UV_LINK_MODE: "copy"
    volumes:
      - ./:/app
      - /app/.venv
    command: ["sh", "-c", "uv run aerich upgrade"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile          # <-- your existing root Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"                   # change if your server uses another port
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      REDIS_URL: "redis://valkey:6379/0"
      UV_LINK_MODE: "copy"  # Use copy mode to avoid hardlink warnings in Docker volumes
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_EXPERIMENT_NAME: "seer-workflow-agent"
      MLFLOW_ENABLED: "${MLFLOW_ENABLED:-true}"
      FRONTEND_URL: "${FRONTEND_URL:-https://app.getseer.dev}"
      BACKEND_API_URL: "${BACKEND_API_URL:-localhost:${API_PORT:-8000}}"
      AUTO_OPEN_BROWSER: "${AUTO_OPEN_BROWSER:-true}"
      CHAT_MESSAGES_TOTAL_SELF_HOSTED: "${CHAT_MESSAGES_TOTAL_SELF_HOSTED:--1}"
      redirect_uri_scheme: "http"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./:/app  # Mount source code for instant updates in development (overrides COPY in Dockerfile)
      - /app/.venv  # Exclude local .venv (Docker will create its own venv)
    command: ["api", "--reload"]  # Use --reload for hot-reloading in development

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      REDIS_URL: "redis://valkey:6379/0"
      UV_LINK_MODE: "copy"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_EXPERIMENT_NAME: "seer-worker"
      MLFLOW_ENABLED: "${MLFLOW_ENABLED:-true}"
    volumes:
      - ./:/app
      - /app/.venv
    # Use worker-watch for hot-reloading in development (uses watchmedo with debouncing)
    command: ["worker-watch"]

volumes:
  postgres_data:
  mlflow_data:
