services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-seer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  browserless:
    image: ghcr.io/browserless/chromium
    ports:
      - "${BROWSERLESS_PORT:-3000}:3000"
    environment:
      TOKEN: "${BROWSERLESS_TOKEN:-}"
      CONCURRENT: "${BROWSERLESS_MAX_CONCURRENT:-5}"
      TIMEOUT: "${BROWSERLESS_TIMEOUT:-300000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/active || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      UV_LINK_MODE: "copy"
    volumes:
      - ./:/app
      - /app/.venv
    command: ["sh", "-c", "PGPASSWORD=${POSTGRES_PASSWORD:-postgres} psql -h postgres -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seer} -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE SCHEMA IF NOT EXISTS seer;' && uv run aerich upgrade"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile          # <-- your existing root Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"                   # change if your server uses another port
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      browserless:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      REDIS_URL: "redis://valkey:6379/0"
      UV_LINK_MODE: "copy"  # Use copy mode to avoid hardlink warnings in Docker volumes
      # MLFLOW_TRACKING_URI: "http://mlflow:5000"
      # MLFLOW_EXPERIMENT_NAME: "seer-workflow-agent"
      # MLFLOW_ENABLED: "${MLFLOW_ENABLED:-true}"
      BROWSERLESS_URL: "ws://browserless:3000"
      BROWSERLESS_TOKEN: "${BROWSERLESS_TOKEN:-}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-5173}}"
      BACKEND_API_URL: "${BACKEND_API_URL:-localhost:${API_PORT:-8000}}"
      AUTO_OPEN_BROWSER: "${AUTO_OPEN_BROWSER:-true}"
      CHAT_MESSAGES_TOTAL_SELF_HOSTED: "${CHAT_MESSAGES_TOTAL_SELF_HOSTED:--1}"
      redirect_uri_scheme: "http"
      # Memory layer (Mem0) - set MEMORY_ENABLED=true to enable
      MEMORY_ENABLED: "${MEMORY_ENABLED:-true}"
      MEM0_VECTOR_STORE: "${MEM0_VECTOR_STORE:-pgvector}"
      MEM0_QDRANT_HOST: "${MEM0_QDRANT_HOST:-qdrant}"
      MEM0_QDRANT_PORT: "${MEM0_QDRANT_PORT:-6333}"
      MEM0_COLLECTION_NAME: "${MEM0_COLLECTION_NAME:-nexus_user_memories_openai}"
      MEMORY_CONTEXT_INJECTION_ENABLED: "${MEMORY_CONTEXT_INJECTION_ENABLED:-true}"
      MEMORY_CONTEXT_MAX_MEMORIES: "${MEMORY_CONTEXT_MAX_MEMORIES:-10}"
      MEMORY_EXTRACTION_ENABLED: "${MEMORY_EXTRACTION_ENABLED:-true}"
      MEMORY_EXTRACTION_MODEL: "${MEMORY_EXTRACTION_MODEL:-moonshotai/kimi-k2.5}"
      MEM0_LLM_PROVIDER: "${MEM0_LLM_PROVIDER:-openrouter}"
      MEM0_EMBEDDER_PROVIDER: "${MEM0_EMBEDDER_PROVIDER:-openai}"
      MEM0_EMBEDDER_MODEL: "${MEM0_EMBEDDER_MODEL:-text-embedding-3-small}"
      MEM0_EMBEDDING_DIMS: "${MEM0_EMBEDDING_DIMS:-1536}"
      AUTH_PROVIDER: "${AUTH_PROVIDER:-local}"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./:/app  # Mount source code for instant updates in development (overrides COPY in Dockerfile)
      - /app/.venv  # Exclude local .venv (Docker will create its own venv)
    command: ["api", "--reload", "--timeout-graceful-shutdown", "2"]  # Use --reload for hot-reloading in development; bound shutdown wait for long-lived dev streams

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      browserless:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      REDIS_URL: "redis://valkey:6379/0"
      UV_LINK_MODE: "copy"
      BROWSERLESS_URL: "ws://browserless:3000"
      BROWSERLESS_TOKEN: "${BROWSERLESS_TOKEN:-}"
      # MLFLOW_TRACKING_URI: "http://mlflow:5000"
      # MLFLOW_EXPERIMENT_NAME: "seer-worker"
      # MLFLOW_ENABLED: "${MLFLOW_ENABLED:-true}"
      # Memory layer (Mem0) - required for background extraction
      MEMORY_ENABLED: "${MEMORY_ENABLED:-true}"
      MEM0_VECTOR_STORE: "${MEM0_VECTOR_STORE:-pgvector}"
      MEM0_QDRANT_HOST: "${MEM0_QDRANT_HOST:-qdrant}"
      MEM0_QDRANT_PORT: "${MEM0_QDRANT_PORT:-6333}"
      MEM0_COLLECTION_NAME: "${MEM0_COLLECTION_NAME:-nexus_user_memories_openai}"
      MEMORY_EXTRACTION_ENABLED: "${MEMORY_EXTRACTION_ENABLED:-true}"
      MEMORY_EXTRACTION_MODEL: "${MEMORY_EXTRACTION_MODEL:-moonshotai/kimi-k2.5}"
      MEM0_LLM_PROVIDER: "${MEM0_LLM_PROVIDER:-openrouter}"
      MEM0_EMBEDDER_PROVIDER: "${MEM0_EMBEDDER_PROVIDER:-openai}"
      MEM0_EMBEDDER_MODEL: "${MEM0_EMBEDDER_MODEL:-text-embedding-3-small}"
      MEM0_EMBEDDING_DIMS: "${MEM0_EMBEDDING_DIMS:-1536}"
      AUTH_PROVIDER: "${AUTH_PROVIDER:-local}"
    volumes:
      - ./:/app
      - /app/.venv
    # Use worker-watch for hot-reloading in development (uses watchmedo with debouncing)
    command: ["worker-watch"]

  frontend:
    image: node:22-alpine
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    working_dir: /app
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_BACKEND_API_URL: "${VITE_BACKEND_API_URL:-http://localhost:8000}"
      VITE_CLERK_PUBLISHABLE_KEY: "${VITE_CLERK_PUBLISHABLE_KEY:-}"
    volumes:
      - ./seer-frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]

volumes:
  postgres_data:
  mlflow_data:
  frontend_node_modules:
