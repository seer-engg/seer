services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-seer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # mlflow:
  #   image: ghcr.io/mlflow/mlflow:v3.8.1
  #   ports:
  #     - "${MLFLOW_PORT:-5000}:5000"
  #   environment:
  #     MLFLOW_BACKEND_STORE_URI: "sqlite:////mlflow/mlflow.db"
  #     MLFLOW_DEFAULT_ARTIFACT_ROOT: "/mlflow/artifacts"
  #     MLFLOW_ALLOWED_HOSTS: "*"
  #   volumes:
  #     - mlflow_data:/mlflow
  #   command: >
  #     sh -c "mlflow server --host 0.0.0.0 --port 5000
  #     --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow/mlflow.db}
  #     --default-artifact-root ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlflow/artifacts}
  #     --allowed-hosts \"${MLFLOW_ALLOWED_HOSTS:-*}\""

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      UV_LINK_MODE: "copy"
    volumes:
      - ./:/app
      - /app/.venv
    command: ["sh", "-c", "uv run aerich upgrade"]
    restart: "no"

  # Optional seed service - only runs with: docker compose --profile seed up
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      UV_LINK_MODE: "copy"
      # AWS credentials for S3 access (required for seeding)
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      WORKFLOW_FILE_S3_BUCKET: "${WORKFLOW_FILE_S3_BUCKET:-}"
      WORKFLOW_FILE_S3_ENDPOINT_URL: "${WORKFLOW_FILE_S3_ENDPOINT_URL:-}"
    volumes:
      - ./:/app
      - /app/.venv
    command: ["sh", "-c", "uv run python scripts/seed_import.py"]
    restart: "no"
    profiles:
      - seed  # Only activate with --profile seed

  api:
    build:
      context: .
      dockerfile: Dockerfile          # <-- your existing root Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"                   # change if your server uses another port
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      REDIS_URL: "redis://valkey:6379/0"
      UV_LINK_MODE: "copy"  # Use copy mode to avoid hardlink warnings in Docker volumes
      # MLFLOW_TRACKING_URI: "http://mlflow:5000"
      # MLFLOW_EXPERIMENT_NAME: "seer-workflow-agent"
      # MLFLOW_ENABLED: "${MLFLOW_ENABLED:-true}"
      FRONTEND_URL: "${FRONTEND_URL:-https://app.getseer.dev}"
      BACKEND_API_URL: "${BACKEND_API_URL:-localhost:${API_PORT:-8000}}"
      AUTO_OPEN_BROWSER: "${AUTO_OPEN_BROWSER:-true}"
      CHAT_MESSAGES_TOTAL_SELF_HOSTED: "${CHAT_MESSAGES_TOTAL_SELF_HOSTED:--1}"
      redirect_uri_scheme: "http"
      # Memory layer (Mem0) - set MEMORY_ENABLED=true to enable
      MEMORY_ENABLED: "${MEMORY_ENABLED:-true}"
      MEM0_VECTOR_STORE: "${MEM0_VECTOR_STORE:-pgvector}"
      MEM0_QDRANT_HOST: "${MEM0_QDRANT_HOST:-qdrant}"
      MEM0_QDRANT_PORT: "${MEM0_QDRANT_PORT:-6333}"
      MEM0_COLLECTION_NAME: "${MEM0_COLLECTION_NAME:-nexus_user_memories}"
      MEMORY_CONTEXT_INJECTION_ENABLED: "${MEMORY_CONTEXT_INJECTION_ENABLED:-true}"
      MEMORY_CONTEXT_MAX_MEMORIES: "${MEMORY_CONTEXT_MAX_MEMORIES:-10}"
      MEMORY_EXTRACTION_ENABLED: "${MEMORY_EXTRACTION_ENABLED:-true}"
      MEMORY_EXTRACTION_MODEL: "${MEMORY_EXTRACTION_MODEL:-moonshotai/kimi-k2.5}"
      MEM0_LLM_PROVIDER: "${MEM0_LLM_PROVIDER:-openrouter}"
      MEM0_EMBEDDER_PROVIDER: "${MEM0_EMBEDDER_PROVIDER:-huggingface}"
      MEM0_EMBEDDER_MODEL: "${MEM0_EMBEDDER_MODEL:-sentence-transformers/all-MiniLM-L6-v2}"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./:/app  # Mount source code for instant updates in development (overrides COPY in Dockerfile)
      - /app/.venv  # Exclude local .venv (Docker will create its own venv)
    command: ["api", "--reload"]  # Use --reload for hot-reloading in development

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seer}"
      REDIS_URL: "redis://valkey:6379/0"
      UV_LINK_MODE: "copy"
      # MLFLOW_TRACKING_URI: "http://mlflow:5000"
      # MLFLOW_EXPERIMENT_NAME: "seer-worker"
      # MLFLOW_ENABLED: "${MLFLOW_ENABLED:-true}"
      # Memory layer (Mem0) - required for background extraction
      MEMORY_ENABLED: "${MEMORY_ENABLED:-true}"
      MEM0_VECTOR_STORE: "${MEM0_VECTOR_STORE:-pgvector}"
      MEM0_QDRANT_HOST: "${MEM0_QDRANT_HOST:-qdrant}"
      MEM0_QDRANT_PORT: "${MEM0_QDRANT_PORT:-6333}"
      MEM0_COLLECTION_NAME: "${MEM0_COLLECTION_NAME:-nexus_user_memories}"
      MEMORY_EXTRACTION_ENABLED: "${MEMORY_EXTRACTION_ENABLED:-true}"
      MEMORY_EXTRACTION_MODEL: "${MEMORY_EXTRACTION_MODEL:-moonshotai/kimi-k2.5}"
      MEM0_LLM_PROVIDER: "${MEM0_LLM_PROVIDER:-openrouter}"
      MEM0_EMBEDDER_PROVIDER: "${MEM0_EMBEDDER_PROVIDER:-huggingface}"
      MEM0_EMBEDDER_MODEL: "${MEM0_EMBEDDER_MODEL:-sentence-transformers/all-MiniLM-L6-v2}"
    volumes:
      - ./:/app
      - /app/.venv
    # Use worker-watch for hot-reloading in development (uses watchmedo with debouncing)
    command: ["worker-watch"]

volumes:
  postgres_data:
  mlflow_data:
