name: Build Base Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'Dockerfile.base'

  workflow_dispatch:
    inputs:
      playwright_version:
        description: 'Playwright version override (default: extracted from pyproject.toml)'
        required: false
        type: string

concurrency:
  group: build-base-image
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_BASE_REPOSITORY: seer-base

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-24.04-arm
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Playwright version from pyproject.toml
        id: playwright
        run: |
          PW_VERSION=$(grep 'playwright>=' pyproject.toml | sed 's/.*>=//; s/[",].*//')
          echo "version=${PW_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected Playwright version: ${PW_VERSION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          build-args: |
            PLAYWRIGHT_VERSION=${{ inputs.playwright_version || steps.playwright.outputs.version }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:pw-${{ inputs.playwright_version || steps.playwright.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
