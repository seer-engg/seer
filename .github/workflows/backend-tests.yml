name: Backend Tests

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint migrations
        run: uv run python scripts/lint-migrations.py

      - name: Test migrations
        run: |
          # Start test database
          docker run -d --name test-postgres \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=seer_test \
            -p 5432:5432 \
            pgvector/pgvector:pg16

          # Wait for postgres
          sleep 5

          # Run migrations
          export DATABASE_URL="postgresql://test:test@localhost:5432/seer_test"
          uv run aerich upgrade

          # Cleanup
          docker stop test-postgres
          docker rm test-postgres

      - name: Run test suite
        run: uv run pytest --ignore=tests/e2e
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/seer_test"
