name: Backend Tests

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'

  run-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Lint migrations
        run: uv run python scripts/lint-migrations.py

      - name: Run test suite
        run: uv run pytest --ignore=tests/e2e -n auto --cov=src/seer --cov-report=xml
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Run E2E tests
        if: github.base_ref == 'main'
        run: uv run pytest tests/e2e -v --tb=short -x
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
          DOCKER_HOST: "unix:///var/run/docker.sock"

  tests:
    needs: [changes, run-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.changes.outputs.backend }}" != "true" ]]; then
            echo "No backend changes — skipping tests"
            exit 0
          fi
          if [[ "${{ needs.run-tests.result }}" == "success" ]]; then
            echo "Tests passed"
            exit 0
          fi
          echo "Tests failed or were cancelled"
          exit 1
