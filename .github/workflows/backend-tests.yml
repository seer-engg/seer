name: Backend Tests

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: seer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint migrations
        run: uv run python scripts/lint-migrations.py

      - name: Enable pgvector extension
        run: PGPASSWORD=test psql -h localhost -U test -d seer_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Test migrations
        run: uv run aerich upgrade
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/seer_test"

      - name: Run test suite
        run: uv run pytest --ignore=tests/e2e -n auto --cov=src/seer --cov-report=xml --ignore=tests/e2e_real
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/seer_test"

  e2e-tests:
    runs-on: ubuntu-latest
    # Run e2e tests after unit/integration tests pass
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run E2E tests with Testcontainers
        run: |
          # Testcontainers manages Docker containers automatically
          # No need for manual setup - containers start on demand
          uv run pytest tests/e2e_real -v --tb=short -x
        env:
          # Testcontainers configuration
          TESTCONTAINERS_RYUK_DISABLED: "false"
          DOCKER_HOST: "unix:///var/run/docker.sock"
